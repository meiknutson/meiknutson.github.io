<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mei Knutson — Portfolio</title>
<meta name="description" content="Portfolio of Mei Knutson.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=42dot+Sans:wght@400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!--
  Each Figma frame is one full-width section stacked top to bottom. Every
  layer is placed as a percentage of its 1440x1024 artboard, so a section
  scales as one piece. Coordinates read: --x/--y = top-left, --w/--h = size.
  For cropped layers, --ix/--iy/--iw/--ih place the image inside its window.
-->
<!--
  The sections scroll inside .scroller rather than the document. That is what
  lets the nav keep the Figma hue blend: a fixed or sticky element always
  creates a stacking context and so can never blend with what scrolls behind
  it, but an absolutely positioned sibling of the scroll container can.
-->
<div class="shell">

<main class="scroller" id="main">

  <!-- ==================== Home — Figma node 1:3 ==================== -->
  <section class="stage" id="home" aria-label="Home">

    <div class="layer" style="--x:0%; --y:2.09404%; --w:99.97556%; --h:97.90596%; --blend:hard-light">
      <img src="assets/ulva.webp" alt="" fetchpriority="high" decoding="async">
    </div>

    <div class="layer" style="--x:8.59375%; --y:0%; --w:85.83986%; --h:96.15518%; --blend:multiply">
      <img src="assets/blob2.webp" alt="" fetchpriority="high" decoding="async">
    </div>

    <div class="layer" style="--x:7.37306%; --y:3.98213%; --w:69.58007%; --h:88.01924%; --blend:color-burn; --opacity:.58">
      <img src="assets/plocamium.webp" alt="" decoding="async">
    </div>

    <div class="layer" style="--x:24.09722%; --y:56.54297%; --w:65.90278%; --h:61.13281%">
      <img src="assets/white.webp" alt="" decoding="async">
    </div>

    <div class="layer" style="--x:34.22852%; --y:5.42396%; --w:21.94824%; --h:93.64916%; --blend:hard-light; --opacity:.34">
      <img src="assets/teal-soft.webp" alt="" decoding="async">
    </div>

    <!-- Two layers share one alpha mask, kept as separate masked boxes so each
         keeps its own blend mode against the art underneath. -->
    <div class="layer layer--masked" style="--x:33.10547%; --y:3.81050%; --w:24.26758%; --h:96.18949%; --blend:hard-light; --opacity:.45">
      <img src="assets/teal-fill.webp" alt="" decoding="async">
    </div>

    <div class="layer layer--masked layer--wash" style="--x:33.10547%; --y:3.81050%; --w:24.26758%; --h:96.18949%">
      <img src="assets/teal-wash.webp" alt="" decoding="async">
    </div>

    <div class="layer" style="--x:17.23633%; --y:10.36732%; --w:79.66309%; --h:76.51905%; --blend:multiply; --opacity:.36">
      <img src="assets/dots-a.webp" alt="" decoding="async">
    </div>

    <div class="layer" style="--x:16.72363%; --y:10.19567%; --w:80.76172%; --h:76.89667%; --blend:multiply; --opacity:.36">
      <img src="assets/dots-b.webp" alt="" decoding="async">
    </div>

    <div class="layer" style="--x:39.94141%; --y:62.23824%; --w:41.40625%; --h:11.01957%; --blend:multiply; --opacity:.46">
      <img src="assets/portfolio-pill.webp" alt="" decoding="async">
    </div>

    <p class="layer" style="--x:42.62695%; --y:64.05767%; --w:36.52344%; --h:8.78819%">
      <img src="assets/portfolio-word.webp" alt="Portfolio" decoding="async">
    </p>

    <h1 class="layer" style="--x:-1.45833%; --y:-1.46484%; --w:102.91667%; --h:102.92969%">
      <img src="assets/name.webp" alt="Mei Knutson" fetchpriority="high" decoding="async">
    </h1>

  </section>


  <!-- ================ Sustainability — Figma node 1:8 ================ -->
  <section class="stage" id="sustainability" aria-labelledby="sustainability-heading">

    <h2 class="visually-hidden" id="sustainability-heading">Sustainability</h2>

    <!-- Same Ulva asset as the hero, but this frame rotates it rather than
         reflecting it, so it is the vertical flip of the baked file. -->
    <div class="layer layer--flip-y" style="--x:0%; --y:2.09404%; --w:99.97556%; --h:97.90596%; --blend:hard-light">
      <img src="assets/ulva.webp" alt="" decoding="async">
    </div>

    <div class="layer band-soft" style="--x:1.805556%; --y:0%; --w:100%; --h:10.15625%"></div>

    <!-- Animated GIF from the mockup: cycles three plates every 700ms. -->
    <a class="layer card" href="#" style="--x:17.291667%; --y:21.191406%; --w:26.25%; --h:36.914063%">
      <img src="assets/sciillust.gif"
           alt="Scientific illustrations, cycling between Red Algae of Monterey, Fig-Wasp Mutualism, and Giant Kelp Ecomorphs of Monterey Bay"
           decoding="async">
    </a>

    <a class="layer card crop" href="#" style="--x:53.125%; --y:35.15625%; --w:29.930556%; --h:42.089844%;
                                               --ix:-0.12%; --iy:-0.07%; --iw:100%; --ih:177.78%">
      <img src="assets/invasive-pieces.webp" alt="Invasive Pieces: jewellery made from sea urchin skeletons" decoding="async">
    </a>

    <!-- Hand-drawn frames sit above the photos they surround. -->
    <div class="layer crop" style="--x:15.208333%; --y:16.992188%; --w:30.625%; --h:47.460938%;
                                   --ix:-49.27%; --iy:-34.79%; --iw:322.2%; --ih:207.85%">
      <img src="assets/artwork-sci-frame.webp" alt="" decoding="async">
    </div>

    <div class="layer crop" style="--x:49.027778%; --y:29.394531%; --w:38.194444%; --h:53.515625%;
                                   --ix:-128.85%; --iy:-55.09%; --iw:260.89%; --ih:186.37%">
      <img src="assets/artwork-invasive-frame.webp" alt="" decoding="async">
    </div>

    <p class="layer caption" style="--x:19.930556%; --y:61.914063%; --w:24.375%; --h:4.199219%">
      scientific illustration<br>(click for gallery)
    </p>

    <p class="layer caption" style="--x:58.263889%; --y:79.492188%; --w:27.291667%; --h:4.980469%">
      invasive pieces
    </p>

  </section>

</main>

<!--
  The nav's geometry is still the Figma nav's: a 1440x104 bar with the links
  at the same coordinates, as percentages of that bar. Two stacked layers —
  a blur for the glass distortion, and the magenta hue blend over it. They
  have to be separate elements: backdrop-filter would create a stacking
  context and cut the blend off from the page.
-->
<header class="nav">
  <div class="nav__frame">
    <div class="nav__glass" aria-hidden="true"></div>
    <div class="nav__hue" aria-hidden="true"></div>
    <nav aria-label="Main">
      <ul class="nav__links">
        <li style="--x:10.76389%;  --w:6.493056%"><a href="#home" class="is-current" aria-current="page">home</a></li>
        <li style="--x:26.66667%;  --w:15.150463%"><a href="#sustainability">sustainability</a></li>
        <li style="--x:50%;        --w:9.484953%"><a href="#">physical</a></li>
        <li style="--x:67.98611%;  --w:5.283565%"><a href="#">print</a></li>
        <li style="--x:82.824069%; --w:6.620368%"><a href="#">about</a></li>
      </ul>
    </nav>
  </div>
</header>

</div><!-- /.shell -->


<!-- Mobile frame — Figma node 113:398. The designed "under construction"
     notice. It replaces the whole scrolling site below 768px, and has no nav
     by design. -->
<div class="stage stage--mobile">

  <h1 class="visually-hidden">Mei Knutson — Portfolio</h1>

  <div class="layer" style="--x:-162.68657%; --y:-16.53968%; --w:358.12139%; --h:114.70902%; --blend:hard-light">
    <img src="assets/ulva.webp" alt="" fetchpriority="high" decoding="async">
  </div>

  <div class="layer" style="--x:-131.90299%; --y:-18.99314%; --w:307.48607%; --h:112.65778%; --blend:multiply">
    <img src="assets/blob2.webp" alt="" fetchpriority="high" decoding="async">
  </div>

  <div class="layer" style="--x:-136.27562%; --y:-14.32755%; --w:249.24205%; --h:103.12551%; --blend:color-burn; --opacity:.58">
    <img src="assets/plocamium.webp" alt="" decoding="async">
  </div>

  <div class="layer" style="--x:-76.36816%; --y:47.25400%; --w:236.06965%; --h:71.62471%">
    <img src="assets/white.webp" alt="" decoding="async">
  </div>

  <div class="layer" style="--x:-40.07696%; --y:-12.63828%; --w:78.62057%; --h:109.72167%; --blend:hard-light; --opacity:.34">
    <img src="assets/teal-soft.webp" alt="" decoding="async">
  </div>

  <div class="layer layer--masked" style="--x:-44.09982%; --y:-14.52865%; --w:86.92864%; --h:112.69798%; --blend:hard-light; --opacity:.45">
    <img src="assets/teal-fill.webp" alt="" decoding="async">
  </div>

  <div class="layer layer--masked layer--wash" style="--x:-44.09982%; --y:-14.52865%; --w:86.92864%; --h:112.69798%">
    <img src="assets/teal-wash.webp" alt="" decoding="async">
  </div>

  <div class="layer" style="--x:-100.94450%; --y:-6.84653%; --w:285.36030%; --h:89.65161%; --blend:multiply; --opacity:.36">
    <img src="assets/dots-a.webp" alt="" decoding="async">
  </div>

  <div class="layer" style="--x:-102.78102%; --y:-7.04763%; --w:289.29571%; --h:90.09404%; --blend:multiply; --opacity:.36">
    <img src="assets/dots-b.webp" alt="" decoding="async">
  </div>

  <!-- Blurred white ellipse behind the copy. Placed at its expanded box: the
       SVG is 817x1055 because the Gaussian blur bleeds past the 417x655 shape. -->
  <img class="layer m-ellipse" style="--x:-51.73960%; --y:-12.23930%; --w:203.23383%; --h:120.71053%"
       src="assets/ellipse.svg" alt="" decoding="async">

  <div class="layer crop" style="--x:-3.73134%; --y:13.38673%; --w:107.46269%; --h:69.45080%;
                                 --ix:-64.96%; --iy:-9.57%; --iw:226.1%; --ih:114.42%">
    <img src="assets/artwork-frame.webp" alt="" decoding="async">
  </div>

  <p class="layer m-notice" style="--x:19.90050%; --y:24.82838%; --w:68.15920%; --h:41.30435%">
    sorry, the mobile version of this website is still under construction! for best viewing, check it out on desktop
  </p>

  <p class="layer m-smiley" style="--x:55.97015%; --y:60.06865%" aria-hidden="true">☻</p>

</div>

<script src="js/scrollspy.js" defer></script>
</body>
</html>
